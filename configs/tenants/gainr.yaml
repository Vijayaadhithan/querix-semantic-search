company:
  id: gainr
  # Loads Gainr-owned policy, compatibility, analytics, and client contracts.
  plugin: gainr
  planner_adapter: gainr
  # Tenant-owned planning and ranking hooks. Generic tenants use "default".
  search_policy: gainr

planner:
  enabled: true
  # Gainr-specific spelling and language variants are semantic rewrites only.
  # They do not affect another tenant; normalized child categories remain soft
  # unless the tenant policy explicitly provides a broader safety boundary.
  query_aliases:
    # Reviewed romanized-Tamil marketplace terms. Keep this list curated from
    # observed searches; importing raw search history would create ambiguous
    # rewrites and leak one tenant's vocabulary into generic search behavior.
    enaku veedu vadaiku venum: house home residential accommodation for rent
    enaku veedu vadakaiku venum: house home residential accommodation for rent
    enaku veedu vadagaiku venum: house home residential accommodation for rent
    enakku veedu vadaiku venum: house home residential accommodation for rent
    enakku veedu vadakaikku venum: house home residential accommodation for rent
    enaky veedu vadaiku venum: house home residential accommodation for rent
    enaky veedu vadakaiku venum: house home residential accommodation for rent
    veedu vadaiku venum: house home residential accommodation for rent
    veedu vadakaiku venum: house home residential accommodation for rent
    veedu vadagaiku venum: house home residential accommodation for rent
    josiyakar: astrologer astrology service
    joshiyakar: astrologer astrology service
    josiyar: astrologer astrology service
    jothidakar: astrologer astrology service
    jothidar: astrologer astrology service
    appartment: apartment
    bke: bike
    bkes: bike
    botany: botony
    camara: camera
    carpantar: carpenter
    cemara: camera
    consultent: consultant
    contracter: contractor
    contrator: contractor
    corpenter: carpenter
    councellor: counsellor
    counselor: counsellor
    decorater: decorator
    desginer: designer
    desiner: designer
    dumbbell: dumbell
    dumbbells: dumbell
    electrican: electrician
    electician: electrician
    electricion: electrician
    electriction: electrician
    electrlcian: electrician
    electrition: electrician
    eletrician: electrician
    genarator: generator
    helpar: helper
    invertor: inverter
    jewelry: jewellery
    jwellery: jewellery
    jwellerys: jewellery
    jewllary: jewellery
    labtop: laptop
    labor: labour
    machanic: mechanic
    meccanic: mechanic
    oporater: operator
    opretor: operator
    photograher: photographer
    plambar: plumber
    plumper: plumber
    projecter: projector
    restaurent: restaurant
    rotavater: rotavator
    talior: tailor
    techcician: technician
    technision: technician
    technition: technician
    tecnician: technician
    terapist: therapist
    theropist: therapist
    therpist: therapist
    traineer: trainer
    trolly: trolley
    truk: truck
  prompt_context: >-
    Gainr is a rental advertisement marketplace. Results can represent
    products, equipment, properties, vehicles, or services. Preserve the
    searcher's perspective: a person who wants to rent or hire an available
    listing needs offer ads; a supplier searching for people who need their
    item or service needs wanted ads. Supplier statements such as having an
    item to rent out, providing a service, or looking for customers must target
    wanted ads; they must not be treated as searches for competing offers. For
    functional vehicle-travel requests,
    interpret comfort and safety as desired vehicle qualities. Prefer usable
    vehicle, cab, taxi, driver, van, bus, or traveller listings; do not treat
    those qualities as requests for safety officers, trainers, or auditors.
    Users may search in Indian-language scripts, code-switching, or informal
    romanized wording. Translate the intended product or service meaning into
    English retrieval concepts before selecting catalog categories; do not guess
    an English product from phonetic spelling alone. On Gainr, a bare massage
    query means massage therapist or massage service; only interpret it as
    equipment when the user explicitly says massager, massage gun, chair,
    machine, device, or equipment. When a vehicle word is the object of a
    service phrase, select the service rather than the vehicle listing: for
    example, "car painting" means an automotive painting professional, and
    "bike acting driver" means an acting-driver service.

retrieval:
  # The setting name is retained for compatibility. Selective metadata filters
  # are ranked exactly; broader filters use pgvector 0.8 iterative filtered
  # HNSW so the predicate is enforced while the graph continues scanning.
  adaptive_vector_post_filter_metadata: true
  # Keep the strongest reranked matches first, then the remaining fused
  # vector/BM25 matches, and only then continue from the filtered catalogue.
  # related_tail_product_ids still requires at least one structured constraint,
  # so this does not turn a fully unfiltered semantic query into a catalogue dump.
  semantic_related_tail_enabled: true
  semantic_related_tail_requires_explicit_category: false
  # Keep results scoring at least 30% of the strongest result. The relative
  # floor also works when Gainr changes reranker providers.
  reranker_relative_score_floor: 0.30

api:
  endpoint_slug: gainr
  key_envs:
    - GAINR_API_KEY

database:
  backend: mysql
  # Stable identity of the authoritative Gainr company database. Transferred
  # indexes must be migrated to this namespace without re-embedding.
  index_namespace: hvkbynbu_wwwdevsl_slowr_test
  host_env: MYSQL_HOST
  port_env: MYSQL_PORT
  database_env: MYSQL_DATABASE
  user_env: MYSQL_USER
  password_env: MYSQL_PASSWORD
  search_ready_table: ads_search_ready
  # The ETL reconciles this stable table in place. The database account cannot
  # DELETE rows, so inactive rows must be excluded from every backend read.
  active_column: is_search_active
  content_column: embedding_content
  bm25_column: bm25_content
  search_id_column: id
  result_table: ads
  result_id_column: id
  result_type_column: type
  timeouts:
    connect_seconds: 10
    read_seconds: 300
    write_seconds: 300
    statement_timeout_ms: 0
  pool:
    min_size: 4
    # The Gainr database permits 16 concurrent connections. Search execution
    # remains capped separately, while the wider pool prevents concurrent
    # compatibility-response hydration from timing out behind four sockets.
    max_size: 16
    timeout_seconds: 5
    # Gainr's remote MySQL wait_timeout is eight hours. Avoid adding a health
    # ping to the first search after each one-minute Voyage pacing interval.
    validation_interval_seconds: 300
  # Local testing uses plaintext loopback. Production must use verify-full
  # with a CA path supplied through ca_file_env.
  tls:
    mode: disable
    mode_env: GAINR_DB_TLS_MODE
    ca_file_env: GAINR_DB_TLS_CA_FILE
    cert_file_env: GAINR_DB_TLS_CERT_FILE
    key_file_env: GAINR_DB_TLS_KEY_FILE

storage:
  vector_backend: pgvector
  vector_dimensions: 768
  pgvector:
    use_company_database: false
    host_env: PGVECTOR_HOST
    port_env: PGVECTOR_PORT
    database_env: PGVECTOR_DATABASE
    user_env: PGVECTOR_USER
    password_env: PGVECTOR_PASSWORD
    schema: public
    table: gainr_search_vectors
    # Serve the reduced-payload SQL path after production shadow verification.
    query_mode: optimized
    # Block API readiness until the vector heap and HNSW index have been loaded
    # into PostgreSQL's fixed buffer pool. Broad HNSW queries otherwise pay
    # repeated buffer promotion costs after idle periods.
    prewarm_on_startup: true
    prewarm_mode: buffer
    hnsw:
      # HNSW is the pgvector ANN index. Higher ef_search improves recall but
      # costs CPU per query.
      m: 16
      # Build inactive generations with a denser candidate search so graph
      # quality is stable across alternating slots. This changes build cost,
      # not serving-query latency.
      ef_construction: 128
      ef_search: 100
  bm25_path: storage/companies/gainr/bm25.sqlite3

payload:
  request_mapping:
    query: query
    cursor: cursor
    page_size: page_size
  public_fields:
    - result_tier
    - id
    - type
    - category_type
    - parent_id
    - category_id
    - title
    - slug
    - description
    - rental_duration
    - rental_fee
    - is_rent_negotiable
    - city_id
    - locality_id
    - custom_locality
    - photos
    - total_favorite
    - total_like
    - users_rating_count
    - rating_avg
    - created_at
    - updated_at
  field_mapping: {}
  filter_schema:
    main_category_name: keyword
    subcategory_name: keyword
    state_name: keyword
    city_name: keyword
    locality_name: keyword
    rental_duration: keyword
    rental_fee: number

rate_limit:
  requests_per_minute: 120
  burst: 20

# Tenant-facing search history plus operator-only provider/API usage. Both are
# stored in Gainr's MySQL database for now; request_id keeps the operator rows
# portable to a separate internal database later.
analytics:
  enabled: true
  endpoint_slug: gainr
  # Dashboard period boundaries and graph buckets use the tenant's business time.
  timezone: Asia/Kolkata
  # Company-facing dashboard, query, and status response contract.
  adapter: gainr
  # Separate product credential: the search API continues using GAINR_API_KEY.
  api_key_envs:
    - GAINR_ANALYTICS_API_KEY
  # Individual search and API records exposed by analytics are limited to the
  # recent operational window. Business catalogue/user trends remain complete.
  history_days: 90
  search_history_table: semantic_search_history
  api_usage_table: semantic_search_api_usage
  queue_capacity: 1000
  # Gainr's company portal is a complete marketplace analytics workspace.
  # Search demand is one business area alongside supply, customers, pricing,
  # listing quality, geography, and engagement. Keep this selection tenant-owned
  # so another marketplace can choose a different set without branching code.
  metrics:
    company:
      search_intelligence:
        - q94_catalog_demand
        - q95_unmet_demand_by_city_category
        - q96_demand_supply_gap
        - q97_ad_type_demand
        - q3_trending_terms
        - q10_language
        - q11_typos
        - q12_query_length
        - q15_search_volume
        - q16_new_subcategories
        - q88_repeat_demand
        - q89_category_fulfillment
      deep_analytics:
        - q47_supply_by_category
        - q48_supply_by_city
        - q50_low_supply_categories
        - q51_user_growth
        - q52_users_by_state
        - q54_platform
        - q55_ads_per_user
        - q56_verification
        - q57_retention
        - q58_products_vs_services
        - q59_top_subcategories
        - q60_rental_fee_distribution
        - q61_negotiable
        - q62_ad_status
        - q63_top_ads
        - q64_city_density
        - q65_premium_adoption
        - q68_premium_by_category
        - q69_contact_views
        - q70_photos
        - q71_description_length
        - q73_attribute_completeness
      market_intelligence:
        - q75_marketplace_overview
        - q76_geographic_heatmap
        - q77_top_listings
        - q78_pricing_benchmark
        - q79_temporal_patterns
        - q80_active_listings
        - q81_user_acquisition_by_state
        - q82_engagement
        - q83_activation
        - q84_seller_concentration
    internal:
      api_performance:
        - q21_success_rate
        - q22_execution_paths
        - q23_latency_stats
        - q24_latency_by_path
        - q26_token_consumption
        - q29_provider_reliability
        - q30_latency_per_operation
        - q31_model_latency
        - q32_reranking_fallback
        - q33_failure_reasons
        - q35_result_distribution
        - q40_avg_api_calls
        - q41_multi_attempt
        - q45_embedding_latency
        - q46_query_planning_bottleneck
        - q93_operation_token_usage
  # The analytics image uses read-only SQL scans once per day. These explicit
  # names form Gainr's normalized analytics source contract.
  tables:
    search_history: semantic_search_history
    api_usage: semantic_search_api_usage
    ads: ads
    users: users
    categories: categories
    sub_categories: sub_categories
    states: states
    location: location
    attributes: attributes
    attribute_values: attribute_values
    ads_attributes: ads_attributes
  # API telemetry currently lives in Gainr's database. Set this to false and
  # provide a database block when the internal telemetry database is split.
  telemetry:
    use_company_database: true

# Gainr's current frontend calls these legacy paths under /api/v1/gainr:
# search-suggestions, filter-data, filter-result, and recent-search.
# This adapter is deliberately enabled only for Gainr; other tenants keep the
# generic configurable /search contract.
compatibility:
  adapter: gainr_legacy
  # The ETL-owned snapshot contains the complete public card projection. The
  # API must not fan out to ads, users, or ads_attributes during a search.
  serves_cards_from_search_ready: true
  users_table: users
  page_size: 20
  # Keep the first frontend page inside the bounded hosted rerank window. Later
  # pages use fused vector/BM25 matches before the filtered catalogue tail.
  semantic_ranked_window: 20
  suggestions_limit: 8
  recent_limit: 10
  recent_ttl_seconds: 7776000
  # Change only these two values if the production Network request uses
  # different price-range keys.
  # Gainr's deployed clients use fee_min/fee_max. The adapter also accepts the
  # canonical min_fee/max_fee names used by direct API callers.
  min_fee_field: fee_min
  max_fee_field: fee_max
  # Gainr UI contract: 1 = Fixed and 0 = Negotiable. These are translated to
  # ads.is_rent_negotiable values 0 and 1 respectively.
  fixed_fee_id: 1
  negotiable_fee_id: 0
  # Keep internal routing and usage detail in server logs, not in Gainr's
  # legacy frontend response contract.
  emit_search_meta: false
  image_path: https://gainr.in/uploads/post/
