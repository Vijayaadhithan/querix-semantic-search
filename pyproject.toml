[project]
name = "personal-rag"
version = "0.1.0"
description = "Multi-tenant hybrid retrieval and reranking API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.0",
    "psycopg[binary]==3.3.4",
    "pymysql==1.2.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "redis==8.0.1",
    "requests==2.34.2",
    "uvicorn==0.51.0",
]

[dependency-groups]
analytics = [
    "pandas==3.0.5",
    "sqlalchemy==2.0.52",
]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "B904",
    "C4",
    "E4",
    "E7",
    "E9",
    "E501",
    "F",
    "I",
    "RUF100",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM114",
    "SIM118",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/storage/redis.py" = ["E501"]
