[project]
name = "personal-rag"
version = "0.1.0"
description = "Multi-tenant hybrid retrieval and reranking API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.0",
    "psycopg[binary]==3.3.4",
    "pymysql==1.2.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "redis==8.0.1",
    "requests==2.34.2",
    "uvicorn==0.51.0",
]

[dependency-groups]
analytics = [
    "pandas==3.0.5",
]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
