services:
  api:
    build:
      context: .
    env_file:
      - path: .env
        required: true
      - path: .env.keys
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-host.docker.internal}
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: 5432
      API_TENANT_ENGINE_CACHE_SIZE: ${API_TENANT_ENGINE_CACHE_SIZE:-3}
      API_TENANT_MAX_CONCURRENT_SEARCHES: ${API_TENANT_MAX_CONCURRENT_SEARCHES:-1}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
      - ./configs/tenants:/app/configs/tenants:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    mem_limit: 1g
    pids_limit: 256
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    env_file:
      - path: .env
        required: true
      - path: .env.keys
        required: false
    environment:
      ANALYTICS_API_HOST: 0.0.0.0
      ANALYTICS_API_PORT: 8010
      ANALYTICS_SNAPSHOT_DB_PATH: /app/storage/analytics/snapshots.sqlite3
      ANALYTICS_TENANT_CONFIG_DIR: /app/configs/tenants
      MYSQL_HOST: ${DOCKER_MYSQL_HOST:-host.docker.internal}
    ports:
      - "127.0.0.1:${ANALYTICS_API_PORT:-8010}:8010"
    volumes:
      - ./storage:/app/storage
      - ./configs/tenants:/app/configs/tenants:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    pids_limit: 256
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
    env_file:
      - path: .env
        required: true
      - path: .env.keys
        required: false
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:?set PGVECTOR_DATABASE}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Keep the HNSW index and its hottest heap pages in PostgreSQL's fixed
    # buffer pool. The production host has enough headroom for this allocation
    # while retaining a larger reclaimable filesystem cache.
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.0@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    profiles:
      - ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    restart: unless-stopped

volumes:
  redis-data:
  pgvector-data:
  ollama-data:
